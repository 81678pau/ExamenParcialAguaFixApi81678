services:
  postgres:
    image: postgres:16
    container_name: aguafix-db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_db:/var/lib/postgresql

  api:
       image: paugonzr/aguafix-api:latest
    container_name: aguafix-api
    ports:
      - 3000:3000
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    depends_on:
      - postgres

volumes:
  postgres_data_db: